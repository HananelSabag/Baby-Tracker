<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8B5E3C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BabyTracker" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>BabyTracker</title>

    <!--
      Boot splash. Inlined (no external CSS/JS) so it paints on the very first
      frame — before the ~340 KB app bundle is parsed. Without it, launching the
      installed PWA showed a blank cream screen for a second or two.
      main.jsx removes it once React has mounted.
    -->
    <style>
      #bt-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #FFF8F0;
        background-image: radial-gradient(ellipse 80% 45% at 50% 38%, rgba(232, 184, 75, 0.20) 0%, transparent 70%);
        font-family: Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s ease;
        /*
          Failsafe. This overlay sits above everything at z-9999, so if the app
          bundle never boots — parse error, blocked script, offline chunk — it
          would lock the user out of the page entirely. Fade it out on a timer
          no matter what. main.jsx normally dismisses it long before this.
        */
        animation: bt-splash-failsafe 0.4s ease 8s forwards;
      }
      /* The JS path wins: cancel the failsafe animation and hide immediately. */
      #bt-splash[data-hiding='true'] { animation: none; opacity: 0; visibility: hidden; }

      @keyframes bt-splash-failsafe {
        to { opacity: 0; visibility: hidden; }
      }

      .bt-splash-badge {
        position: relative;
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Two concentric halo rings, matching the sign-in screen's app icon. */
      .bt-splash-badge::before,
      .bt-splash-badge::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(232, 184, 75, 0.30);
        animation: bt-halo 2.4s ease-in-out infinite;
      }
      .bt-splash-badge::before { inset: -10px; }
      .bt-splash-badge::after  { inset: -22px; border-color: rgba(232, 184, 75, 0.16); animation-delay: 0.4s; }

      .bt-splash-icon {
        width: 96px;
        height: 96px;
        border-radius: 28px;
        overflow: hidden;
        border: 4px solid #fff;
        background: linear-gradient(135deg, #FFF6E8 0%, #FFDFAC 100%);
        box-shadow: 0 10px 32px rgba(139, 94, 60, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 52px;
        line-height: 1;
      }
      .bt-splash-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

      .bt-splash-word {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #3D2B1F;
      }

      .bt-splash-dots { display: flex; gap: 6px; }
      .bt-splash-dots i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #C9956C;
        animation: bt-bounce 1.1s ease-in-out infinite;
      }
      .bt-splash-dots i:nth-child(2) { animation-delay: 0.15s; }
      .bt-splash-dots i:nth-child(3) { animation-delay: 0.30s; }

      @keyframes bt-halo {
        0%, 100% { transform: scale(1);    opacity: 0.9; }
        50%      { transform: scale(1.07); opacity: 0.4; }
      }
      @keyframes bt-bounce {
        0%, 100% { transform: translateY(0);    opacity: 0.35; }
        50%      { transform: translateY(-5px); opacity: 1; }
      }

      /* Respect the OS setting — the in-app accessibility toggle can't run this early. */
      @media (prefers-reduced-motion: reduce) {
        .bt-splash-badge::before,
        .bt-splash-badge::after,
        .bt-splash-dots i { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="bt-splash" role="status" aria-label="טוען את BabyTracker">
      <div class="bt-splash-badge">
        <div class="bt-splash-icon">
          <img src="/icons/icon-192.png" alt="" onerror="this.parentNode.textContent='🍼'" />
        </div>
      </div>
      <div class="bt-splash-word">BabyTracker</div>
      <div class="bt-splash-dots"><i></i><i></i><i></i></div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
